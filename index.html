<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Мини-игра</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9ecf,#ffd6e8);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.card{
    background:#fff;
    padding:25px;
    border-radius:20px;
    text-align:center;
    width:320px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}
button{
    display:block;
    width:100%;
    margin:10px 0;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#ff5c93;
    color:white;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#ff3f80;
}
#result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    color:#ff3f80;
}
</style>
</head>
<body>

<div class="card">
<h2>💖 Мини-игра</h2>
<p>Как думаешь, что делает мой день лучше?</p>

<button onclick="show()">🌸 Хорошая погода</button>
<button onclick="show()">🎵 Любимая музыка</button>
<button onclick="show()">🍫 Что-нибудь вкусное</button>
<button onclick="show()">💬 Сообщение от тебя</button>

<div id="result"></div>
</div>

<script>
function show(){
document.getElementById("result").innerHTML=
"✨ Правильного ответа нет... Но если честно, больше всего мой день делает лучше сообщение от тебя. ❤️😊";
}
</script>

</body>
</html>
